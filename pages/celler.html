<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>celler ~ Ottomansfield</title>
  <meta name="description" content="live celle list from the freakyville celle scanner, merged from every client running the mod.">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="celler ~ Ottomansfield">
  <meta property="og:description" content="live celle list from the freakyville celle scanner.">
  <meta property="og:url" content="https://ottomansfield.com/pages/celler.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* page-only styles. everything themeable still comes from :root in style.css */
    .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; font-size: 14px; color: var(--muted);
    }
    .stat b { color: var(--ink); font-weight: 500; }
    .stat.is-free b { color: var(--accent); }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .controls input, .controls select {
      background: var(--panel); border: 1px solid var(--border); color: var(--ink);
      border-radius: 6px; padding: 7px 10px; font-family: var(--font-body); font-size: 15px;
    }
    .controls input { flex: 1 1 200px; }
    .controls input:focus, .controls select:focus { outline: 1px solid var(--accent); }

    /* cards instead of a table: the countdown gets room to breathe and it
       collapses to one column on a phone without hiding anything */
    .celle-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .celle {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 2px 14px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
    }
    /* ids are read character by character, so they use a mono face rather than
       the pixel display font. In Silkscreen at this size C-19 reads as C-13 and
       0/O and 5/S are nearly identical. */
    .celle__id {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .celle__owner { color: var(--muted); font-size: 14px; }
    /* explicit placement: id over owner on the left, countdown over "seen" on
       the right, bar across the bottom. left implicit it wrapped onto extra rows. */
    .celle__id    { grid-column: 1; grid-row: 1; }
    .celle__owner { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 14px; }
    .celle__time {
      grid-column: 2; grid-row: 1;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 19px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .celle__seen { grid-column: 2; grid-row: 2; color: var(--muted); font-size: 12px; text-align: right; }
    .celle__bar  { grid-column: 1 / -1; grid-row: 3; }

    /* a thin bar showing how much of the window is left, so you can read
       urgency without doing arithmetic on the numbers */
    .celle__bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
    .celle__bar i { display: block; height: 100%; background: var(--accent); transition: width .5s linear; }

    .celle.is-free { border-left-color: var(--accent); }
    .celle.is-free .celle__time { color: var(--accent); font-size: 16px; font-weight: 500; letter-spacing: .01em; }
    .celle.is-soon { border-left-color: #e0b070; }
    .celle.is-soon .celle__time { color: #e0b070; }
    .celle.is-soon .celle__bar i { background: #e0b070; }
    .celle.is-expired { border-left-color: #c98b8b; }
    .celle.is-expired .celle__time { color: #c98b8b; font-size: 14px; }
    /* dimmed: nobody has actually seen this recently, the countdown is a guess */
    .celle.is-stale { opacity: .5; }
    .celle.is-stale .celle__time::after { content: ' ?'; color: var(--muted); }
    .star { color: #e0b070; }

    .empty { color: var(--muted); padding: 18px 4px; }
    .note { color: var(--muted); font-size: 14px; margin-top: 14px; }
    .is-error { color: #e08080; }
    @media (max-width: 480px) {
      .celle { grid-template-columns: 1fr; }
      .celle__time { grid-row: auto; grid-column: 1; text-align: left; }
      .celle__seen { text-align: left; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- HEADER START  ============================================ -->
  <header class="site-header">
    <h1 class="wordmark">ottomansfield</h1>
    <nav class="nav" aria-label="main">
      <a href="/">home</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="/pages/celler.html" class="active">celler</a>
    </nav>
  </header>
  <!-- HEADER END  ============================================== -->

  <main>

    <section class="box" aria-labelledby="celler-h">
      <div class="box__title" id="celler-h">celler</div>
      <div class="box__body">
        <p>live list from the freakyville celle scanner, merged from everyone
           running the mod. <span id="freshness">loading…</span></p>
      </div>
    </section>

    <ul class="stat-row" id="stats"></ul>

    <div class="controls">
      <input type="search" id="q" placeholder="search celle or owner…" autocomplete="off" aria-label="search">
      <select id="filter" aria-label="filter">
        <option value="all">all</option>
        <option value="free">for sale now</option>
        <option value="soon">sold / counting down</option>
        <option value="fav">favourites</option>
        <option value="fresh">recently seen only</option>
      </select>
      <select id="sort" aria-label="sort">
        <option value="time">soonest first</option>
        <option value="id">by celle id</option>
        <option value="seen">recently seen first</option>
      </select>
    </div>

    <ul class="celle-list" id="rows"></ul>
    <p class="empty" id="empty" hidden>ingen celler matcher.</p>

    <p class="note" id="note"></p>

  </main>

  <!-- FOOTER START  ============================================ -->
  <footer class="site-footer">
    <p>coded by hand, 2026</p>
  </footer>
  <!-- FOOTER END  ============================================== -->

</div><!-- /.wrap -->

<script>
(function () {
  'use strict';

  var DATA_URL = '/data/celler.json';
  var data = null;
  var el = {
    rows: document.getElementById('rows'),
    stats: document.getElementById('stats'),
    fresh: document.getElementById('freshness'),
    note: document.getElementById('note'),
    q: document.getElementById('q'),
    filter: document.getElementById('filter'),
    sort: document.getElementById('sort'),
    empty: document.getElementById('empty')
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /**
   * Countdown that changes resolution as it gets close, so a celle hours out
   * does not flicker every second, while one about to open shows the seconds
   * you actually care about.
   */
  function duration(ms) {
    if (ms <= 0) return '0.00s';
    var total = Math.floor(ms / 1000);
    var d = Math.floor(total / 86400);
    var h = Math.floor((total % 86400) / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    if (d > 0) return d + 'd ' + h + 'h';
    // under an hour the seconds matter, so they are always shown
    if (h > 0) return h + 'h ' + pad(m) + 'm ' + pad(s) + 's';
    if (m > 0) return m + ':' + pad(s);
    // last minute: hundredths, because this is the part you actually race
    var cs = Math.floor((ms % 1000) / 10);
    return s + '.' + pad(cs) + 's';
  }

  function age(ts) {
    if (!ts) return 'unknown';
    var ms = Date.now() - ts;
    if (ms < 60000) return 'just now';
    var mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + 'm ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.floor(hours / 24) + 'd ago';
  }

  // Same extrapolation the mod and the bot use, so the countdown keeps ticking
  // between snapshots rather than freezing on whatever the last write said.
  // lastSeen is a millisecond timestamp, so this is accurate to the millisecond
  // even though the snapshot only carries whole seconds.
  function liveMs(c) {
    return Math.max(0, c.remainingSeconds * 1000 - (Date.now() - c.lastSeen));
  }

  function liveSeconds(c) {
    return Math.floor(liveMs(c) / 1000);
  }

  /** How full the bar is: 1 when just seen, 0 when the timer runs out. */
  function progress(c) {
    if (!c.remainingSeconds) return 0;
    return Math.max(0, Math.min(1, liveMs(c) / (c.remainingSeconds * 1000)));
  }

  function keep(c) {
    var q = el.q.value.trim().toLowerCase();
    if (q && (c.id + ' ' + (c.owner || '')).toLowerCase().indexOf(q) === -1) return false;
    switch (el.filter.value) {
      case 'free':  return c.status === 'TIL_SALG';
      case 'soon':  return c.status !== 'TIL_SALG';
      case 'fav':   return !!c.favourite;
      case 'fresh': return !c.stale;
      default:      return true;
    }
  }

  function sorted(list) {
    var by = el.sort.value;
    return list.slice().sort(function (a, b) {
      if (by === 'id') return a.id.localeCompare(b.id, 'da');
      if (by === 'seen') return b.lastSeen - a.lastSeen;
      // soonest first, with the ones already for sale at the very top
      var af = a.status === 'TIL_SALG', bf = b.status === 'TIL_SALG';
      if (af !== bf) return af ? -1 : 1;
      return liveSeconds(a) - liveSeconds(b);
    });
  }

  function div(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  // Nodes that still need a sub-second countdown, refreshed by fastTick.
  var ticking = [];

  function timeText(c) {
    var ms = liveMs(c);
    if (c.status === 'TIL_SALG') return 'for sale now';
    if (ms <= 0) return 'expired?';
    return (c.confirmed ? '' : '~') + duration(ms);
  }

  function render() {
    if (!data) return;
    var list = sorted(data.celler.filter(keep));

    ticking = [];
    el.rows.textContent = '';
    el.empty.hidden = list.length > 0;

    list.forEach(function (c) {
      var ms = liveMs(c);
      var live = Math.floor(ms / 1000);
      var expired = c.status !== 'TIL_SALG' && ms <= 0;
      var free = c.status === 'TIL_SALG';
      // under an hour and still counting: worth flagging
      var soon = !free && !expired && live <= 3600;

      var li = document.createElement('li');
      li.className = 'celle'
        + (free ? ' is-free' : '')
        + (soon ? ' is-soon' : '')
        + (expired ? ' is-expired' : '')
        + (c.stale ? ' is-stale' : '');

      var id = div('celle__id');
      if (c.favourite) {
        var st = document.createElement('span');
        st.className = 'star';
        st.textContent = '\u2605 ';
        id.appendChild(st);
      }
      id.appendChild(document.createTextNode(c.id));

      var timeEl = div('celle__time', timeText(c));
      // only the last minute needs faster than 1 Hz
      if (!free && !expired && ms < 60000) {
        ticking.push({ el: timeEl, c: c });
      }

      li.appendChild(id);
      li.appendChild(timeEl);
      li.appendChild(div('celle__owner', c.owner || 'no owner'));
      li.appendChild(div('celle__seen', 'seen ' + age(c.lastSeen)));

      if (!free && !expired) {
        var bar = div('celle__bar');
        var fill = document.createElement('i');
        fill.style.width = (progress(c) * 100).toFixed(1) + '%';
        bar.appendChild(fill);
        li.appendChild(bar);
      }

      el.rows.appendChild(li);
    });

    el.stats.textContent = '';
    [
      ['is-free', 'for sale', data.counts.forSale],
      ['', 'known', data.counts.total],
      ['', 'not seen recently', data.counts.stale],
      ['', 'favourites', data.counts.favourites]
    ].forEach(function (st) {
      var li = document.createElement('li');
      li.className = 'stat ' + st[0];
      li.appendChild(document.createTextNode(st[1] + ': '));
      var b = document.createElement('b');
      b.textContent = st[2];
      li.appendChild(b);
      el.stats.appendChild(li);
    });

    el.fresh.textContent = 'last scan ' + age(data.newestSighting) + '.';
    el.note.textContent = 'updated ' + age(data.generatedAt)
      + '. dimmed entries have not been seen recently, so their countdown is estimated.';
  }

  function load() {
    fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) { data = j; render(); })
      .catch(function (e) {
        el.fresh.className = 'is-error';
        el.fresh.textContent = 'could not load data (' + e.message + ').';
      });
  }

  el.q.addEventListener('input', render);
  el.filter.addEventListener('change', render);
  el.sort.addEventListener('change', render);
  /**
   * Updates only the entries inside their last minute. A full re-render at this
   * rate would rebuild the whole list 20 times a second for no reason, and the
   * list order does not change meaningfully inside one second anyway.
   */
  function fastTick() {
    for (var i = 0; i < ticking.length; i++) {
      ticking[i].el.textContent = timeText(ticking[i].c);
    }
  }

  load();
  setInterval(load, 60000);   // fetch a newer snapshot
  setInterval(render, 1000);  // full re-render: ordering, classes, bars
  setInterval(fastTick, 50);  // hundredths for anything in its last minute
})();
</script>
</body>
</html>
